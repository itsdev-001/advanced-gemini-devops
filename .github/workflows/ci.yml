name: Production CI Pipeline

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Test & Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Stage 1: Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Stage 2: Setup Node.js Environment
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Stage 3: Dependency Installation
      - name: Install Dependencies
        run: npm ci

      # Stage 4: Lint
      - name: Run ESLint
        run: npm run lint

      # Stage 5: Type Checking
      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      # Stage 6: Production Build
      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Stage 7: Set up Docker Buildx & Build Image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: gemini-ai-frontend:${{ github.sha }}

      # Stage 8: Trivy Container Vulnerability Scan
      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@v0.28.0
        with:
          image-ref: gemini-ai-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

