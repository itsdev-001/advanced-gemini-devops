name: Production CI/CD Pipeline

'on':
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  id-token: write  # Required for AWS OIDC authentication

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: advanced-gemini-devops
  AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build, Lint, Test & Security Scan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      # Stage 1: Checkout Repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # Stage 2: Setup Node.js Environment
      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # Stage 3: Dependency Installation
      - name: Install Dependencies
        run: npm ci

      # Stage 4: Lint
      - name: Run ESLint
        run: npm run lint

      # Stage 5: Type Checking
      - name: Run TypeScript Type Check
        run: npx tsc --noEmit

      # Stage 6: Production Build
      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      # Stage 7: Set up Docker Buildx & Build Image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Production Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          load: true
          push: false
          tags: gemini-ai-frontend:${{ github.sha }}

      # Stage 8: Trivy Container Vulnerability Scan
      - name: Run Trivy Container Security Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: gemini-ai-frontend:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      # Stage 9: Configure AWS Credentials via OIDC (Push to Main Only)
      - name: Configure AWS Credentials via GitHub OIDC
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: GitHubActions-ECR-Push
          aws-region: ${{ env.AWS_REGION }}

      # Stage 10: Log in to Amazon ECR
      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Stage 11: Tag and Push Image to Amazon ECR
      - name: Tag and Push Docker Image to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"
          IMAGE_URI="$ECR_REGISTRY/$ECR_REPOSITORY"
          
          # Tag with immutable commit SHA and latest
          docker tag gemini-ai-frontend:${{ github.sha }} "$IMAGE_URI:${{ github.sha }}"
          docker tag gemini-ai-frontend:${{ github.sha }} "$IMAGE_URI:latest"
          
          # Push both tags to Amazon ECR
          docker push "$IMAGE_URI:${{ github.sha }}"
          docker push "$IMAGE_URI:latest"
        working-directory: .

