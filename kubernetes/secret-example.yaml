# ==============================================================================
# Kubernetes Secret Template (Example)
# Environment: Production
#
# IMPORTANT SECURITY RULE:
# NEVER commit real API keys or sensitive secrets to Git.
#
# To create the real secret imperatively at runtime:
#   kubectl create secret generic advanced-gemini-secret \
#     --namespace advanced-gemini \
#     --from-literal=GEMINI_API_KEY="<YOUR_GEMINI_API_KEY>" \
#     --dry-run=client -o yaml | kubectl apply -f -
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: advanced-gemini-secret
  namespace: advanced-gemini
  labels:
    app.kubernetes.io/name: advanced-gemini
    app.kubernetes.io/part-of: advanced-gemini-devops
    environment: production
type: Opaque
stringData:
  # Replace with actual API key at deployment time
  GEMINI_API_KEY: "your_gemini_api_key_here"

