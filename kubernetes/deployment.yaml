apiVersion: apps/v1
kind: Deployment
metadata:
  name: advanced-gemini
  namespace: advanced-gemini
  labels:
    app.kubernetes.io/name: advanced-gemini
    app.kubernetes.io/part-of: advanced-gemini-devops
    app.kubernetes.io/version: "1.0.0"
    environment: production
spec:
  replicas: 2
  revisionHistoryLimit: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: advanced-gemini
  template:
    metadata:
      labels:
        app.kubernetes.io/name: advanced-gemini
        app.kubernetes.io/part-of: advanced-gemini-devops
        environment: production
    spec:
      serviceAccountName: advanced-gemini
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: advanced-gemini
          image: 552916920151.dkr.ecr.ap-south-1.amazonaws.com/advanced-gemini-devops:v1.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: advanced-gemini-config
          env:
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: advanced-gemini-secret
                  key: GEMINI_API_KEY
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/name
                      operator: In
                      values:
                        - advanced-gemini
                topologyKey: kubernetes.io/hostname

